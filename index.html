<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путь в основу</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F6;--card:#FFFFFF;--ink:#0B1F3F;--mut:#5B6B85;--line:#D3DBE6;--blue:#1448B8;--acc:#F2B705;--ok:#1E9E5A;--bad:#C93C3C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1730;--card:#112447;--ink:#EAF0FA;--mut:#8FA3C4;--line:#1F3763;--blue:#6E9BFF;--acc:#F5C400;--ok:#37C77F;--bad:#FF6B6B}}
:root[data-theme="dark"]{--bg:#0A1730;--card:#112447;--ink:#EAF0FA;--mut:#8FA3C4;--line:#1F3763;--blue:#6E9BFF;--acc:#F5C400;--ok:#37C77F;--bad:#FF6B6B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;font-weight:700;letter-spacing:.01em}
main{max-width:560px;margin:0 auto;padding:16px}
.hero{background:var(--blue);color:#fff;border-radius:6px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border:3px solid rgba(255,255,255,.25);border-radius:50%}
.hero h1{font-size:34px;line-height:1}
.hero small{opacity:.85;font-size:14px}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:5px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .4s}
.stats{display:flex;gap:8px;margin-top:12px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stats b{font:700 24px "Barlow Condensed",sans-serif;display:block;line-height:1.1}
.stats span{font-size:13px;color:var(--mut)}
.seg{display:flex;margin:14px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:10px;border:0;background:var(--card);color:var(--mut);font:600 15px Barlow,sans-serif;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.q{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:12px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.q .chk{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;font-weight:700;color:transparent;margin-top:2px}
.q.done{opacity:.6}.q.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.q.done h3{text-decoration:line-through}
.q h3{font-size:20px}.q p{margin:2px 0 0;color:var(--mut);font-size:15px}
.q .xp{margin-left:auto;font:700 16px "Barlow Condensed",sans-serif;color:var(--blue);white-space:nowrap}
.tag{font-size:13px;font-weight:600;color:var(--c)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.card h2{font-size:24px}.card p{margin:4px 0;color:var(--mut)}
.now{border-color:var(--acc);box-shadow:inset 5px 0 0 var(--acc)}
.ms{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.ms input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok)}
.row{display:flex;gap:8px;margin-top:8px}
.row input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:600 16px Barlow,sans-serif}
.btn{padding:10px 16px;border:0;border-radius:6px;background:var(--blue);color:#fff;font:600 15px Barlow,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.m{display:flex;gap:14px;margin-top:8px;font-size:14px;color:var(--mut)}
.m b{display:block;color:var(--ink);font:700 20px "Barlow Condensed",sans-serif}
.up{color:var(--ok)}.dn{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 2px;border:0;background:none;color:var(--mut);font:600 12.5px Barlow,sans-serif;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--blue);border-top-color:var(--blue)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.bar2{height:8px;background:var(--line);border-radius:4px;margin:6px 0;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--acc)}
.tip{border-left:5px solid var(--acc)}
.ex{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.ex small{color:var(--mut)}
.ex input{width:76px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:600 16px Barlow,sans-serif}
.sc{display:flex;gap:6px}.sc input{width:58px;padding:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.grid label{font-size:13px;color:var(--mut)}
.grid input,.grid select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:600 16px Barlow,sans-serif}
#cfab{position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:30;width:52px;height:52px;border-radius:50%;border:0;background:var(--acc);color:#0B1F3F;font-size:24px;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer;display:none}
#cp{position:fixed;left:8px;right:8px;max-width:544px;margin:0 auto;bottom:calc(60px + env(safe-area-inset-bottom,0px));height:min(72vh,520px);z-index:31;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.35);display:none;flex-direction:column;overflow:hidden}
#cp.open{display:flex}
#cp header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--blue);color:#fff}
#cp header h2{font-size:20px}#cp header button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 8px;font:600 13px Barlow,sans-serif;cursor:pointer}
#cmsgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.cm{max-width:88%;padding:8px 11px;border-radius:8px;white-space:pre-wrap;font-size:15px}
.cm.me{align-self:flex-end;background:var(--blue);color:#fff}.cm.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.cn{align-self:flex-start;font-size:13px;color:var(--ok)}
#cp form{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line)}
#cin{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 16px Barlow,sans-serif}
#csend:disabled{opacity:.5}
.clk{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.clk b{font:700 40px "Barlow Condensed",sans-serif;letter-spacing:.02em}.clk span{color:var(--mut);font-size:14px;text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:10px 0}.cal b{font-size:12px;color:var(--mut)}.cd{padding:5px 0;border-radius:6px;font-size:14px}.cd.ok{background:var(--ok);color:#fff}.cd.td{outline:2px solid var(--acc);font-weight:700}
.cd.ev{background:var(--blue);color:#fff}.calh{display:flex;justify-content:space-between;align-items:center;gap:8px}.calh h2{text-transform:capitalize}
#tst{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:8px;right:8px;max-width:544px;margin:0 auto;z-index:40;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.35);font-size:15px;cursor:pointer}
#cfab.nw::after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.sn{border-left:5px solid var(--acc);padding:8px 10px;background:var(--bg);border-radius:6px;margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<button id="cfab" aria-label="ИИ-помощник">💬</button>
<div id="tst" role="status"></div>
<section id="cp" aria-label="ИИ-помощник"><header><h2>Помощник</h2><span><button id="crst">↶ Отменить правку</button> <button id="cx" aria-label="Закрыть чат" style="font-size:18px;line-height:1">✕</button></span></header><div id="cmsgs"></div><form id="cf"><input id="cin" placeholder="Например: замени совет дня про сон" autocomplete="off"><button class="btn" id="csend">Отправить</button></form></section>
<script>
const TABS=[["today","Сегодня"],["food","Еда"],["gym","Зал"],["log","Дневник"],["tests","Тесты"],["plan","План"],["me","Я"]];
const RANKS=[["Запасной",0],["Ротация",500],["Игрок дубля",1500],["Лидер дубля",3500],["Кандидат в основу",7000],["Основа",11000]];
const COL={sleep:"#7A5CE0",food:"#E07A2F",mob:"#1E9E8F",wall:"#1448B8",scan:"#C93C8A",phys:"#C93C3C"};
const WALL=[
["Видеоразбор","20 минут: посмотри свой матч или игру топ-вингера. Выпиши 3 момента: куда смотрел, что решил, что было лучше."],
["Стена: первое касание","200 касаний: внутренняя и внешняя сторона, левая и правая. Принимай мяч сразу в ход, не под себя."],
["Стена: сканирование","15 минут. Перед каждым приёмом бросай взгляд через плечо и на поле. Цель: ни одного приёма вслепую."],
["Дриблинг","6 подходов по 4 финта (ножницы, твист, вытягивание, смещение). Старт на скорости, финиш ускорением."],
["Стена: удар","40 ударов с отскока: 20 по ходу с подготовкой на правую внутрь, 20 левой. Цель: дальний угол."],
["Навесы","30 навесов левой в заданную зону и 15 после ускорения. Считай попадания, записывай результат."],
["Смещение и удар","20 повторов: уход с левого фланга в центр и удар правой. Из них 5 после финта."]];
const PS=[
["Отдых","Прогулка 30 минут, ролл, ранний сон. Мышцы растут, пока ты отдыхаешь."],
["Кор и прыжки","20 минут: планка, боковая планка, 3×5 прыжков в длину и вверх."],
["Сила ног","35 минут: присед, румынская тяга, выпады 3×6–8. Вес растёт понемногу."],
["Спринты","6×20 м, отдых 90 секунд. Каждый рывок на максимум."],
["Сила верха и кор","35 минут: подтягивания, жим, тяга, кор."],
["Лёгкая мобильность","Без нагрузки перед игрой. Растяжка и 3 коротких ускорения."],
["Игра","Матч или игровая тренировка. После игры запиши одно решение, которое хочешь улучшить."]];
const PV=[
["Отдых и сон","Полный отдых. Прогулка, растяжка, 9 часов сна."],
["Зал A","60 минут: присед 4×6, румынская тяга 3×8, болгарские выпады 3×8, подтягивания."],
["Скорость","8×20 м и 6×30 м, полный отдых между. Старты из разных положений."],
["Зал B","60 минут: становая 3×5, жим 4×6, прыжки на тумбу 4×5, кор."],
["Смена направления","Челнок 5-10-5 ×6, лесенка, торможение и рывок. Работай на скорость."],
["Зал C","60 минут: фронтальный присед, тяга, выпады в стороны, икры, кор."],
["Игровая","Мини-футбол или 7×7 в отпуске, 60 минут. Играй на левом фланге."]];
const QS=d=>{const w=WALL[d],m=S.mode==="vac"?PV[d]:PS[d];return[
{id:"sleep",t:"Сон 8–9 часов",p:"Отбой до 23:00, телефон убран за 30 минут до сна.",xp:20,c:COL.sleep,g:"Восстановление"},
{id:"food",t:"Питание и вода",p:"Белок в каждом приёме (яйца, курица, творог, рыба), углеводы перед тренировкой, 2 литра воды.",xp:15,c:COL.food,g:"Восстановление"},
{id:"mob",t:"Мобильность 10 минут",p:"Бёдра, сгибатели, икры, голеностоп. После тренировки или перед сном.",xp:10,c:COL.mob,g:"Восстановление"},
{id:"wall",t:w[0],p:w[1],xp:30,c:COL.wall,g:"Техника, стена"},
{id:"scan",t:"Голова вверх",p:"На тренировке смотри через плечо до приёма. Вечером запиши 1 ситуацию, где это дало время.",xp:15,c:COL.scan,g:"Мышление"},
{id:"phys",t:m[0],p:m[1],xp:35,c:COL.phys,g:S.mode==="vac"?"Отпуск":"Сезон"}].concat(focusQ())};
const TESTS=[
{id:"s30",n:"Спринт 30 м",u:"с",dir:-1,h:"Старт с места, 3 попытки, записывай лучшую. Время засекает партнёр."},
{id:"shu",n:"Челнок 5-10-5",u:"с",dir:-1,h:"Три конуса на дистанции 5 м. Старт из середины, лучшая из 3 попыток."},
{id:"cmj",n:"Прыжок вверх",u:"см",dir:1,h:"Прыжок с махом рук, отметка мелом на стене. Лучшая из 3."},
{id:"wl",n:"Касания стены за 60 с",u:"раз",dir:1,h:"Передачи в стену двумя ногами. Считай только чистые приёмы."},
{id:"sh",n:"Удары в углы",u:"из 10",dir:1,h:"10 ударов с 16 м в углы ворот: 5 левой, 5 правой после подготовки."},
{id:"kg",n:"Вес",u:"кг",dir:0,h:"Взвешивайся утром натощак раз в неделю."}];
const PH=[
["Фундамент","1–30 ноября",["Сделать стартовые тесты","Спать по 8 часов 5 ночей в неделю","Поговорить с тренером дубля: какие 2 вещи улучшить к весне","Стена 5 раз в неделю"]],
["Отпуск: сила и скорость","декабрь – январь",["Записаться в зал и ходить 3 раза в неделю","Ретест 15 декабря","Ретест 15 января","Прибавить в приседе 15–20% к рабочему весу"]],
["Игровая форма","февраль",["Ретест 1 февраля","Показать тренерам прогресс: сканирование и решения","Сыграть контрольные матчи основы или дубля"]],
["Март: цель","с 1 марта",["Выйти на предсезонку с основой","Выбить место в заявке на матч"]]];
const kd=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const wkDays=()=>{const d=NOW();d.setDate(d.getDate()-((d.getDay()+6)%7));return[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return kd(x)})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TIPS=["Скан: за 2 секунды до приёма определи, где соперник и где свободное место. Привычка складывается за 3–4 недели.","Первое касание решает многое: принимай мяч в сторону от защитника, а не под себя.","Каждый час сна до полуночи восстанавливает лучше, чем час после. Ложись до 23:00.","За 2–3 часа до тренировки ешь углеводы (каша, макароны, банан), после неё белок в течение часа.","Для вингера ускорение на 10–15 м важнее максимальной скорости. Тренируй рывки.","Тренеры замечают тех, кто просит мяч и говорит на поле. Требуй передачу громко.","Финт делай на ходу, не останавливаясь. Дриблинг без скорости ничего не даёт.","Перед ударом один раз посмотри на вратаря, потом на мяч. Бей в угол, а не в силу.","Подвижные голеностоп и бёдра снижают риск травм и убирают скованность в движениях.","После игры запиши одно неверное решение. Через месяц увидишь повторяющуюся ошибку.","Тёмная моча значит, что воды мало. Пей небольшими порциями в течение дня.","Перед навесом заранее выбери зону. Навес без цели остаётся случайностью.","Не пропускай завтрак в учебные дни: энергия нужна и на парах, и для решений на поле.","Смотри игры вингеров и следи за одним: как игрок открывается без мяча.","Тренируйся ради качества повторов, а не ради усталости."];
const tip=()=>`<div class="card tip"><h2>Совет дня</h2><p>${TIPS[Math.floor(Date.now()/864e5)%TIPS.length]}</p></div>`;
const cnt=id=>wkDays().filter(k=>(S.done[k]||[]).includes(id)).length;
const BOSSES=[
{id:"wall",n:"Мастер стены",d:"5 квестов со стеной за неделю",g:5,xp:80,c:()=>cnt("wall")},
{id:"sleep",n:"Режим",d:"5 ночей со сном 8–9 часов",g:5,xp:80,c:()=>cnt("sleep")},
{id:"full",n:"Полный день",d:"3 дня, где закрыты все 6 квестов",g:3,xp:120,c:()=>wkDays().filter(k=>(S.done[k]||[]).length>=6).length},
{id:"game",n:"Игровой отчёт",d:"запиши матч в дневнике",g:1,xp:60,c:()=>S.log.filter(e=>wkDays().includes(e.d)).length}];
const bosses=()=>{const w=wkDays()[0];let h=`<div class="card"><h2>Боссы недели</h2><p>Побеждено за всё время: ${Object.keys(S.claimed).length}. Сброс в понедельник.</p>`;BOSSES.forEach(b=>{const n=Math.min(b.c(),b.g),cl=S.claimed[w+b.id],ok=n>=b.g;h+=`<div style="margin-top:12px"><b>${b.n}</b> <span style="color:var(--mut)">${n}/${b.g}, ${b.d}</span><div class="bar2"><i style="width:${n/b.g*100}%"></i></div>${ok&&!cl?`<button class="btn" data-cl="${b.id}">Забрать +${b.xp} XP</button>`:cl?`<span class="up">Побеждён ✓</span>`:""}</div>`});return h+`</div>`};
const GYM=[
["Зал A","Ноги и сила",[["Присед со штангой","4×6","2 мин"],["Румынская тяга","3×8","2 мин"],["Болгарские выпады","3×8 на ногу","90 с"],["Подтягивания","3×макс","90 с"],["Планка","3×40 с","60 с"]]],
["Зал B","Мощь и прыжки",[["Становая тяга","3×5","2–3 мин"],["Жим лёжа","4×6","2 мин"],["Прыжки на тумбу","4×5","90 с, на максимум"],["Тяга гантели в наклоне","3×10","90 с"],["Боковая планка","3×30 с","60 с"]]],

const SYS=`Ты помощник внутри приложения «Путь в основу»: трекер подготовки футболиста Аарона (левый вингер). Ты помогаешь менять приложение по просьбам пользователя. Меняешь только данные и тексты, не код и не вёрстку. Если просьба невыполнима так, честно скажи.
Сначала прочитай нужный раздел через read_app, потом правь через edit_content (по одной правке за вызов) или set_state. После правок коротко скажи по-русски, что изменил.
Разделы: WALL, PS, PV: списки [название, описание], индекс = день недели (0 воскресенье … 6 суббота); WALL квесты со стеной, PS тренировки в сезон, PV в отпуск. TIPS: список строк-советов. FM: {b,l,s,d: [название приёма, [[блюдо, граммов белка],…]]}. GYM: [[имя, подзаголовок, [[упражнение, подходы, отдых],…]],…]. PH: [[фаза, даты, [цели]],…]. CARDS: [[название, текст]]. DRILL: [[зона, текст]]. FN: {club,game,rest} подсказки питания. TESTS: [{id,n,u,dir,h}]. EV: важные события календаря [["ММ-ДД","название"],…], они видны во вкладке «План». Напоминания: инструмент reminders (встроенные приходят сами в 08:00, 13:30, 17:00, 21:30, 22:45; выключить их можно через set_state remOff=true). Приложение работает по минскому времени.
Пути пишутся через точку, например "2.1" для WALL; op: set (заменить), push (добавить в список по пути), remove (удалить).
set_state меняет данные пользователя: xp (число), mode ("season" или "vac"), ft ("club","game","rest"), gym ({упражнение: вес}), ms ({"фаза-пункт": true/false}), sch (7 дней по [пары, клуб, доп], индекс 0 воскресенье), tab.`;

{name:"read_app",description:"Прочитать раздел приложения (WALL, PS, PV, TIPS, PH, FM, FN, GYM, CARDS, DRILL, TESTS) или state",inputSchema:{type:"object",properties:{what:{type:"string"}},required:["what"]},

execute:async a=>{if(!SK.includes(a.key))return"Нельзя менять "+a.key;pushU({s:a.key,j:JSON.stringify(S[a.key]===undefined?null:S[a.key])});if(a.key==="sch"&&!S.sch)S.sch=defSch();const p=String(a.path||"").split(".").filter(Boolean);if(!p.length)S[a.key]=a.value;else{const k=p.pop(),par=p.length?gp(S[a.key],p):S[a.key];if(par==null)return"Путь не найден";par[k]=a.value}save();view();note(a.key+(a.path?" "+a.path:""));return"ok"}},
{name:"reminders",description:"Напоминания: add (time в формате ЧЧ:ММ и text), remove (id), list",inputSchema:{type:"object",properties:{op:{type:"string",enum:["add","remove","list"]},time:{type:"string"},text:{type:"string"},id:{type:"number"}},required:["op"]},

async function send(){const inp=$c("cin"),t=inp.value.trim();if(!t||busy)return;
